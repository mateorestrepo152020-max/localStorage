<!doctipe.html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewpornt" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios independientes de Lcalstorage</title>
</head>
<body>
    <h1>Ejercicios de localStorage</h1>

    <section>
        <h2>Ejercicio 1.guardar un nombre</h2>
        <from id="fromguardar">
            <label for="nombreguardar">nombre</label>
            <input id="nombreguardar" type="text">
            <button type="submit">guaradar nombre</button>
        </from>
    </section>
        <section>
            <h2>Ejercicio 2. mostrar el nombre guardado</h2>
            <from id="fromMostrar">
                <button type="submit">mostrar nombre</button>
            </from>
            <p id="resultadoMostrar"></p>
        </section>
        <selection>
            <h2>Ejercicio 3. editar el nombre guardado</h2>
            <from id="fromEditar">
                <label for="fromEditar">nuevo nombre</label>
                <input id="nombre Editar" type="text">
                <button type="submit">Actualizar nombre</button>
            </from>   
            <p id="resultadoEditar"></p>
        </selection>
        <selection>
            <h2> Ejercicio 4. Eliminar el nombre gardado</h2>
            <from id="fromEliminar">
                <button type="submit">eliminar nombre</button>
            </from>
            <p id="resultadoEeliminar"></p>
        </selection>
        <from id="fromMascota">
            <lavel for="mascota">mascota</lavel>
            <input type="text" id="rasa" name="rasa" min="0">
            <button type="submit">guardar mascota</button>
        </from>
    <script src="app.js"></script>
</body>

</html>
